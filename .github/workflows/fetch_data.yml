name: Fetch Pipeline Data

on:
    schedule:
        - cron: "15 05 * * *"
    workflow_dispatch:

# This block grants the Action permission to push the commit, fixing the 128 error
permissions:
    contents: write

jobs:
    fetch-and-commit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Download Latest Data from ADLS
              env:
                  AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
              run: |
                  mkdir -p temp_data
                  mkdir -p data

                  # Download the files
                  az storage blob download-batch \
                    --account-name learning11778653 \
                    --source weather-data \
                    --destination temp_data \
                    --pattern "gold/export_daily_summary/*.json" \
                    --connection-string "$AZURE_CONNECTION_STRING"

                  # Debugging line: list downloaded files in the Action logs
                  echo "Downloaded files:"
                  ls -R temp_data

                  # Find the Spark JSON file and rename it to a static name
                  find temp_data -name "*.json" -exec cp {} data/weather_summary.json \;

                  # Clean up
                  rm -rf temp_data

            - name: Commit and Push Changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  git add data/weather_summary.json
                  git commit -m "Automated data sync from ADLS" || echo "No data changes to commit"
                  git push
