name: Fetch Pipeline Data

on:
    schedule:
        # Runs at 05:15 UTC daily (15 minutes after Databricks starts)
        - cron: "15 05 * * *"
    workflow_dispatch: # Allows you to trigger it manually from the UI

jobs:
    fetch-and-commit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Download Latest Data from ADLS
              env:
                  AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
              run: |
                  mkdir -p temp_data
                  mkdir -p data

                  # Download the entire gold export directory contents
                  az storage blob download-batch \
                    --account-name learning11778653 \
                    --source weather-data \
                    --destination temp_data \
                    --pattern "gold/export_daily_summary/*.json" \
                    --connection-string "$AZURE_CONNECTION_STRING"

                  # Find Spark's dynamically named part-0000.json and rename it to a static name
                  find temp_data -name "*.json" -exec cp {} data/weather_summary.json \;

                  # Clean up the messy Spark folder structure
                  rm -rf temp_data

            - name: Commit and Push Changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add data/weather_summary.json
                  # Only commit if there are actual changes to the data
                  git commit -m "Automated data sync from ADLS" || echo "No data changes to commit"
                  git push
